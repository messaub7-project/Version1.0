<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>messAub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="Favicon.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- PAGE D’ACCUEIL -->
    <section id="landingSection" class="landing">
      <div class="landing-inner">
        <h1>Bienvenue sur messAub</h1>
        <p class="subtitle">Connectez-vous ou créez un compte</p>

        <div class="form-container">
          <input type="email" id="email" placeholder="Adresse e-mail" />
          <div class="password-field">
            <input type="password" id="password" placeholder="Mot de passe" />
            <button
              type="button"
              id="togglePassword"
              class="icon-btn"
              aria-label="Afficher le mot de passe"
            ></button>
          </div>
          <div class="btn-row">
            <button id="loginSubmit" class="btn primary">Connexion</button>
            <button id="registerSubmit" class="btn outline">Inscription</button>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION PRINCIPALE -->
    <main id="mainSection" style="display: none">
      <header>
        <span id="userName"></span>
        <button id="logoutBtn" class="btn outline">Déconnexion</button>
      </header>

      <!-- Section Admin -->
      <section id="adminSection" style="display: none; margin-top: 30px">
        <h3>Gestion des événements</h3>
        <input id="eventTitle" placeholder="Titre de l'événement" />
        <button id="createEventBtn" class="btn primary">Créer un événement</button>
        <button id="toggleEmailsBtn" class="btn outline small">Masquer/afficher emails</button>
        <ul id="adminEvents"></ul>
        <ul id="adminMessagesList"></ul>
      </section>

      <!-- Section Utilisateur -->
      <section id="userSection" style="display: none; margin-top: 30px">
        <h3>Événements disponibles</h3>
        <ul id="userEvents"></ul>

        <div id="messageSection" style="display: none; margin-top: 20px">
          <h4 id="messageTitle"></h4>
          <div id="messageInputContainer" style="display: none">
            <textarea id="messageInput" placeholder="Écris ton message ici..." disabled></textarea>
            <button id="sendMessageBtn" class="btn primary" disabled>Envoyer</button>
          </div>
          <ul id="messagesList"></ul>
        </div>
      </section>
    </main>

    <footer id="siteFooter">
      © 2025 — Aubin | Code avec passion et détermination
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
